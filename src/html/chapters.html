<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../assets/icons/icon32.png">
  <title>LibSaver - Редактор оглавления</title>
  <style>body { opacity: 0; }</style>
  <script src="../core/theme-init.js"></script>
  <script src="../utils/title-store.js"></script>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/loading.css">
  <script src="../utils/window-loader.js"></script>
  <link rel="stylesheet" href="../libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../css/editor.css">
  <style>
    .chapters-list {
      flex: 1;
      overflow-y: hidden;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
    }
    .btn-load-more {
      padding: 8px 16px;
      font-size: 13px;
      white-space: nowrap;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .btn-load-more:hover {
      background-color: var(--bg-secondary);
      border-color: var(--accent-color);
    }
    
    .btn-load-more:active {
      transform: scale(0.98);
    }
    
    .load-more-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 16px auto;
      padding: 0 16px;
    }
    /* Кнопки в карточках поиска и диапазона - как вторичные кнопки тулбара */
    .card-btn {
      height: 32px;
      padding: 0 14px;
      font-size: var(--font-size-sm);
      font-weight: 600;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      background-color: var(--background-elevated-2);
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card-btn:hover {
      background-color: var(--background-elevated-2);
      border-color: var(--border-hover);
    }
    .card-btn:active {
      transform: translateY(1px);
    }
    .card-btn i {
      font-size: 12px;
      opacity: 0.9;
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }
    .search-row input[type="search"] {
      flex: 1;
      min-width: 180px;
    }
    .search-row .checkbox-group {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .search-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: var(--spacing-sm);
    }
    .search-actions .counter {
      margin-right: auto;
    }
    .search-actions[hidden], .select-new[hidden] {
      display: none;
    }
    .select-new {
      margin-top: var(--spacing-xs);
      width: 100%;
      justify-content: center;
    }
    .chapters-empty {
      text-align: center;
      color: var(--text-secondary);
      padding: 24px 16px;
      font-size: 13px;
    }
    .toolbar-right .field {
      margin: 0;
      padding: 0;
      background: none;
    }
    .toolbar-right .field select {
      min-width: 150px;
    }
    .counter {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .counter span {
      color: var(--text-primary);
      font-weight: 600;
    }
    .counter-separator {
      color: var(--text-secondary);
      margin: 0 var(--spacing-xs);
    }
    /* Стили для селектора переводчика в главе */
    .chapter-input-wrapper {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
      width: 100%;
      position: relative;
    }
    .chapter-input-wrapper .chapter-input {
      flex: 1;
      padding-right: 8px;
    }
    .chapter-input-wrapper .chapter-translator {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--background-elevated-2);
      padding: var(--spacing-xs) var(--spacing-sm);
      border-radius: var(--border-radius);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }
    /* Серия AnimeLIB: озвучка в строке серии справа, без поля названия */
    .chapter-item.episode .chapter-input-wrapper {
      width: auto;
      margin-left: auto;
    }
    .chapter-item.episode .chapter-translator {
      position: static;
      transform: none;
    }
    .chapter-input-wrapper .chapter-translator:hover {
      background: var(--border-color);
      color: var(--text-primary);
    }
    .chapter-translator-dropdown {
      position: absolute;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 4px;
      box-shadow: var(--card-shadow);
      z-index: 1000;
      min-width: 120px;
      max-height: 200px;
      overflow-y: auto;
    }
    .chapter-translator-option {
      padding: 6px var(--spacing-md);
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 6px;
    }
    .chapter-translator-option:hover {
      background: var(--background-elevated-2);
    }
    .chapter-translator-option.selected {
      background: var(--accent-soft);
      color: var(--text-primary);
    }
    .translator-priority-header {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-align: center;
      font-weight: 500;
    }
    .translator-priority-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
    }
    .translator-priority-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: 10px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      cursor: default;
      transition: all 0.2s;
    }
    .translator-priority-item:active {
      cursor: default;
    }
    .translator-priority-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .translator-priority-item:active {
      cursor: default;
    }
    .translator-priority-name {
      flex: 1;
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
    }
    .translator-priority-count {
      font-size: 11px;
      color: var(--text-secondary);
      cursor: default;
      background: var(--bg-tertiary);
      padding: var(--spacing-xs) var(--spacing-sm);
      border-radius: var(--border-radius);
      font-weight: 500;
    }
    .translator-priority-controls {
      display: flex;
      gap: var(--spacing-xs);
    }
    .translator-priority-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: var(--spacing-xs);
      border-radius: var(--border-radius);
      transition: all 0.2s;
      opacity: 0.5;
      font-size: 10px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .translator-priority-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }
    .translator-priority-btn:active {
      transform: scale(0.95);
    }
    .translator-priority-btn:disabled {
      opacity: 0.2;
      cursor: default;
    }
    .translator-priority-btn:disabled:hover {
      opacity: 0.2 !important;
      color: var(--text-secondary) !important;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn-secondary" id="btn-reset">
        <i class="fa-solid fa-rotate-left"></i>
        Сбросить всё
      </button>
      <button class="btn-danger" id="btn-clear-all">
        <i class="fa-solid fa-eraser"></i>
        Очистить всё
      </button>
    </div>
    <div class="toolbar-right">
      <span class="counter">Всего: <span id="total-chapters">0</span></span>
      <span class="counter-separator">|</span>
      <span class="counter" id="branch-counter">Обнаружено: <span id="chapter-count">0</span></span>
    </div>
  </div>
  
  <div class="container">
    <div class="chapters-card" id="range-card">
      <h4>Диапазон <span id="range-count">0 из 0</span></h4>
      <label class="range-row"><span>от</span><select id="range-from"></select></label>
      <label class="range-row"><span>до</span><select id="range-to"></select></label>
      <button type="button" class="card-btn select-new" id="select-new" hidden><i class="fa-solid fa-wand-magic-sparkles"></i> <span></span></button>
    </div>
    <div class="chapters-card" id="translator-card" style="display: none;">
      <h4>Перевод <span>приоритет</span></h4>
      <div class="translator-priority-list" id="translator-list"></div>
    </div>
    <div class="chapters-card" id="search-card">
      <div class="search-row">
        <input type="search" id="chapter-search" placeholder="Номер, диапазон (10-20), перевод, название (; или +)" aria-label="Поиск глав">
        <span id="only-selected-slot"></span>
      </div>
      <div class="search-actions" id="search-actions" hidden>
        <span class="counter" id="search-count"></span>
        <button type="button" class="card-btn" id="search-select"><i class="fa-solid fa-check"></i> Отметить найденные</button>
        <button type="button" class="card-btn" id="search-unselect"><i class="fa-solid fa-xmark"></i> Снять</button>
      </div>
    </div>
    <div class="chapters-list" id="chapters-list">
      <!-- Список глав для редактирования -->
    </div>
  </div>

  <div class="scroll-buttons" id="scroll-buttons" style="display: none;">
    <button class="scroll-btn" id="scroll-btn" title="Наверх">
      <i class="fa-solid fa-chevron-up"></i>
    </button>
  </div>

  <script src="../utils/header.js"></script>
  <script src="../core/theme.js"></script>
  <script src="../core/chapter-range.js"></script>
  <script src="../utils/autosave.js"></script>
  <script src="../editors/chapters.js"></script>
  <script src="../utils/scroll.js"></script>
</body>
</html>
