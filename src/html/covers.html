<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../assets/icons/icon32.png">
  <title>LibSaver - Редактор обложек</title>
  <style>body { opacity: 0; }</style>
  <script src="../core/theme-init.js"></script>
  <script src="../utils/title-store.js"></script>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/loading.css">
  <script src="../utils/window-loader.js"></script>
  <link rel="stylesheet" href="../libs/fontawesome/css/all.min.css">
  <script src="../libs/Sortable.min.js"></script>
  <link rel="stylesheet" href="../css/editor.css">
  <style>
    body {
      min-height: 400px;
    }
    .container {
      height: 100%;
    }
    .container {
      max-width: 960px;
    }
    /* Обложки сеткой карточек с крупным превью */
    .covers-list {
      flex: 1;
      overflow-y: hidden;
      overflow-x: hidden;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 230px));
      justify-content: center;
      align-items: start; /* карточка высотой по своей обложке, а не по самой высокой в ряду */
      gap: var(--spacing-sm);
      padding-top: 2px; /* место под подъём карточки при наведении: список обрезает всё, что выше него */
    }
    .covers-list > .empty-state {
      grid-column: 1 / -1;
    }
    .cover-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xs);
      display: flex;
      position: relative;
      transition: border-color 0.15s ease, transform 0.15s ease;
      user-select: none;
    }
    .cover-item:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    /* Перетаскивание доступно только когда обложек 2 и более */
    .cover-item:not(:only-child) {
      cursor: grab;
    }
    .cover-item:not(:only-child):active {
      cursor: grabbing;
    }
    .cover-item:not(:only-child) .cover-preview {
      cursor: grab;
    }
    .cover-item:not(:only-child):active .cover-preview,
    .cover-item:not(:only-child):active .cover-preview * {
      cursor: grabbing;
    }
    .sortable-drag,
    .sortable-drag * {
      cursor: grabbing !important;
    }
    /* Если обложка всего одна - никакого перетаскивания и курсоров grab/grabbing */
    .cover-item:only-child,
    .cover-item:only-child * {
      cursor: default;
    }
    .cover-item:only-child:active,
    .cover-item:only-child:active * {
      cursor: default;
    }
    .cover-item-inner {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px;
      width: 100%;
    }
    .cover-preview {
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: var(--bg-tertiary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }
    .cover-preview.loading {
      aspect-ratio: 2 / 3 !important;
    }
    /* Загруженная картинка задаёт высоту превью: обложка другого соотношения сторон - без пустых полей вокруг */
    .cover-preview.has-image {
      background-color: var(--bg-secondary);
      aspect-ratio: auto;
    }
    .cover-preview.has-image .img-wrapper .img-container,
    .cover-preview.has-image .img-wrapper .img-container img {
      width: 100%;
    }
    .cover-preview.has-image .img-wrapper .img-container img {
      max-height: 480px; /* очень вытянутая картинка не растягивает карточку на весь экран */
    }
    .cover-preview img {
      display: none;
    }
    .cover-preview .img-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .cover-preview .img-wrapper .img-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      overflow: hidden;
    }
    .cover-preview .img-wrapper .img-container img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      object-fit: contain;
      display: none;
    }
    .cover-preview .img-wrapper .img-container img.loaded {
      display: block;
      cursor: zoom-in !important; /* клик открывает обложку целиком в новой вкладке */
    }
    .cover-item input[type="text"] {
      cursor: text !important;
      user-select: text;
    }
    .cover-item .btn-file,
    .cover-item .btn-delete {
      cursor: pointer !important;
    }
    /* Рамка места вставки: без :hover-цвета и transition карточки, той же толщины - иначе мигает и прыгает (как в редакторе метаданных) */
    .sortable-ghost,
    .sortable-ghost:hover {
      opacity: 0.4;
      background-color: var(--bg-secondary);
      border: 1px dashed var(--accent-color);
      transform: none;
      transition: none;
      overflow: hidden;
    }
    .sortable-chosen {
      opacity: 1;
      overflow: hidden;
    }
    .sortable-drag {
      opacity: 0;
      overflow: hidden;
    }
    .cover-inputs {
      display: flex;
      flex-direction: column;
    }
    .image-info {
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-secondary);
      min-height: 16px;
      line-height: 16px;
      padding: 0 2px;
      box-sizing: border-box;
      user-select: none;
    }
    .cover-item:has(.cover-preview.has-image) .image-info {
      display: flex;
    }
    .image-meta {
      color: var(--text-secondary);
      text-align: left;
      font-size: 11px;
    }
    .cover-number {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
      margin-left: auto;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .url-group {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 12px;
      outline: none;
      height: 32px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 22%, transparent);
    }
    .btn-file {
      background-color: var(--background-elevated-2);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0;
      font-size: 12px;
      cursor: pointer;
      height: 32px;
      width: 32px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .btn-file:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }
    .btn-delete {
      background-color: rgba(10, 11, 14, 0.6);
      backdrop-filter: blur(6px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.15s ease, background-color 0.15s ease;
      padding: 0;
      font-size: 12px;
      cursor: pointer;
      width: 30px;
      min-width: 30px;
      max-width: 30px;
      height: 30px;
      min-height: 30px;
      max-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-sizing: border-box;
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 1;
    }
    .cover-item:hover .btn-delete,
    .btn-delete:focus-visible {
      opacity: 1;
    }
    .btn-delete:hover {
      background-color: var(--danger-color);
      border-color: var(--danger-color);
    }
    /* Угловые метки и бейдж «Основная» скрыты (номер отображается в строке параметров) */
    .cover-item::after,
    .img-container:has(> img.loaded)::before {
      display: none !important;
    }
    .cover-item:has(img.loaded)::after {
      display: none;
    }
    .cover-item:first-child::after,
    .cover-item:first-child .img-container:has(> img.loaded)::before {
      content: 'Основная';
      display: none !important;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px;
    }
    .counter {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .counter span {
      color: var(--text-primary);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn-secondary" id="btn-add">
        <i class="fa-solid fa-plus"></i>
        Новая обложка
      </button>
      <button class="btn-secondary" id="btn-reset">
        <i class="fa-solid fa-rotate-left"></i>
        Сбросить всё
      </button>
      <button class="btn-danger" id="btn-delete-all">
        <i class="fa-solid fa-trash"></i>
        Удалить всё
      </button>
    </div>
    <div class="toolbar-right">
      <span class="counter">Обложек: <span id="cover-count">0</span></span>
    </div>
  </div>
  
  <div class="container">
    <div class="covers-list" id="covers-list">
      <div class="empty-state">Нет обложек</div>
    </div>
  </div>

  <div class="scroll-buttons" id="scroll-buttons" style="display: none;">
    <button class="scroll-btn" id="scroll-btn" title="Наверх">
      <i class="fa-solid fa-chevron-up"></i>
    </button>
  </div>

  <input type="file" id="file-input" accept="image/*" style="display: none;">
  
  <script src="../libs/jszip.min.js"></script>
  <script src="../core/theme.js"></script>
  <script src="../utils/autosave.js"></script>
  <script src="../editors/covers.js"></script>
  <script src="../utils/scroll.js"></script>
</body>
</html>
