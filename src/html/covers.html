<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../assets/icons/icon32.png">
  <title>LibSaver - Редактор обложек</title>
  <style>body { opacity: 0; }</style>
  <script src="../core/theme-init.js"></script>
  <script src="../utils/title-store.js"></script>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/loading.css">
  <script src="../utils/window-loader.js"></script>
  <link rel="stylesheet" href="../libs/fontawesome/css/all.min.css">
  <script src="../libs/Sortable.min.js"></script>
  <link rel="stylesheet" href="../css/scale-subtle.css">
  <link rel="stylesheet" href="../css/editor.css">
  <style>
    body {
      min-width: 450px;
      min-height: 400px;
    }
    .container {
      height: 100%;
    }
    .container {
      max-width: 960px;
    }
    /* Обложки сеткой карточек с крупным превью */
    .covers-list {
      flex: 1;
      overflow-y: hidden;
      overflow-x: hidden;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 230px));
      justify-content: center;
      gap: var(--spacing-sm);
    }
    .covers-list > .empty-state {
      grid-column: 1 / -1;
    }
    .cover-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xs);
      display: flex;
      position: relative;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .cover-item:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    .cover-item-inner {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px;
      width: 100%;
    }
    .cover-preview {
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: var(--bg-tertiary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }
    .cover-preview.empty {
      cursor: default;
    }
    .cover-preview.error {
      cursor: default;
    }
    .cover-preview.loading {
      cursor: default;
    }
    .cover-preview img {
      display: none;
    }
    .cover-preview .img-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .cover-preview .img-wrapper .img-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--bg-tertiary);
    }
    .cover-preview .img-wrapper .img-container img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      object-fit: contain;
      display: none;
    }
    .cover-preview .img-wrapper .img-container img.loaded {
      display: block;
    }
    .cover-preview .img-wrapper .img-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 8px;
      background-color: rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
    }
    .cover-preview:hover .img-wrapper.has-image .img-container::after {
      opacity: 1;
    }
    /* Стили Tippy для соответствия дизайну */
    .tippy-box[data-theme='dark'] {
      background-color: rgba(10, 10, 10, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .tippy-box[data-theme='dark'] > .tippy-arrow::before {
      border-top-color: var(--border-color);
    }
    .tippy-box[data-theme='dark'] > .tippy-arrow::after {
      border-top-color: rgba(10, 10, 10, 0.95);
    }
    .tippy-box[data-theme='light'] {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .tippy-box[data-theme='light'] > .tippy-arrow::before {
      border-top-color: var(--border-color);
    }
    .tippy-box[data-theme='light'] > .tippy-arrow::after {
      border-top-color: var(--bg-secondary);
    }
    .tippy-content {
      padding: 2px;
    }
    .sortable-ghost {
      opacity: 0.4;
      background-color: var(--bg-secondary);
      border: 2px dashed var(--accent-color);
      overflow: hidden;
    }
    .sortable-chosen {
      opacity: 1;
      overflow: hidden;
    }
    .sortable-drag {
      opacity: 0;
      overflow: hidden;
    }
    .drag-handle {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 3px;
      background-color: var(--border-color);
      border-radius: 2px;
      cursor: grab;
      user-select: none;
    }
    .drag-handle::before {
      content: '';
      position: absolute;
      top: -8px;
      left: -10px;
      right: -10px;
      bottom: -8px;
    }
    .drag-handle:hover {
      background-color: var(--text-primary);
    }
    .drag-handle:active {
      cursor: grabbing;
      background-color: var(--text-primary);
    }
    .cover-inputs {
      display: flex;
      flex-direction: column;
    }
    .image-info {
      font-size: 10px;
      color: var(--text-secondary);
      min-height: 14px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .url-group {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 12px;
      outline: none;
      height: 32px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 22%, transparent);
    }
    .btn-file {
      background-color: var(--background-elevated-2);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0;
      font-size: 12px;
      cursor: pointer;
      height: 32px;
      width: 32px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .btn-file:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }
    .btn-delete {
      background-color: rgba(10, 11, 14, 0.6);
      backdrop-filter: blur(6px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.15s ease, background-color 0.15s ease;
      padding: 0;
      font-size: 12px;
      cursor: pointer;
      width: 30px;
      min-width: 30px;
      max-width: 30px;
      height: 30px;
      min-height: 30px;
      max-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-sizing: border-box;
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 1;
    }
    .cover-item:hover .btn-delete,
    .btn-delete:focus-visible {
      opacity: 1;
    }
    .btn-delete:hover {
      background-color: var(--danger-color);
      border-color: var(--danger-color);
    }
    /* Номер обложки: первая попадает в файл как основная */
    .covers-list {
      counter-reset: cover;
    }
    .cover-item {
      counter-increment: cover;
    }
    .cover-item::after {
      content: counter(cover);
      position: absolute;
      top: 14px;
      left: 14px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 11px;
      background: rgba(10, 11, 14, 0.6);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      line-height: 20px;
      text-align: center;
      pointer-events: none;
    }
    .cover-item:first-child::after {
      content: 'Основная';
      background: var(--accent-color);
      border-color: transparent;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px;
    }
    .counter {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .counter span {
      color: var(--text-primary);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn-secondary" id="btn-add">
        <i class="fa-solid fa-plus"></i>
        Новая обложка
      </button>
      <button class="btn-secondary" id="btn-reset">
        <i class="fa-solid fa-rotate-left"></i>
        Сбросить всё
      </button>
      <button class="btn-danger" id="btn-delete-all">
        <i class="fa-solid fa-trash"></i>
        Удалить всё
      </button>
    </div>
    <div class="toolbar-right">
      <span class="counter">Обложек: <span id="cover-count">0</span></span>
    </div>
  </div>
  
  <div class="container">
    <div class="covers-list" id="covers-list">
      <div class="empty-state">Нет обложек</div>
    </div>
  </div>

  <div class="scroll-buttons" id="scroll-buttons" style="display: none;">
    <button class="scroll-btn" id="scroll-btn" title="Наверх">
      <i class="fa-solid fa-chevron-up"></i>
    </button>
  </div>

  <input type="file" id="file-input" accept="image/*" style="display: none;">
  
  <script src="../libs/jszip.min.js"></script>
  <script src="../libs/FileSaver.min.js"></script>
  <script src="../libs/pica.min.js"></script>
  <script src="../libs/popper.min.js"></script>
  <script src="../libs/tippy-bundle.umd.min.js"></script>
  <script src="../core/theme.js"></script>
  <script src="../utils/autosave.js"></script>
  <script src="../editors/covers.js"></script>
  <script src="../utils/scroll.js"></script>
</body>
</html>
