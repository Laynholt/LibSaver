<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../assets/icons/icon32.png">
  <title>LibSaver</title>
  <script src="../core/theme-init.js"></script>
  <script src="../utils/title-store.js"></script>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../css/panel.css">
</head>
<body>
  <header class="pn-head">
    <button type="button" class="pn-icon pn-back hidden" id="back" aria-label="Назад"><i class="fa-solid fa-chevron-left"></i></button>
    <b class="pn-title" id="title">LibSaver</b>
    <button type="button" class="pn-update hidden" id="update"><i class="fa-solid fa-circle-arrow-up"></i> <span id="update-version"></span></button>
    <button type="button" class="pn-icon pn-close" id="close" aria-label="Закрыть"><i class="fa-solid fa-xmark"></i></button>
  </header>

  <div class="pn-loading" id="loading" role="status">
    <span class="pn-spinner" aria-hidden="true"></span>
    <b>Загружаю тайтл…</b>
  </div>
  <div class="pn-msg hidden" id="error">
    <p id="error-text" role="alert"></p>
    <button type="button" id="retry">Повторить</button>
  </div>

  <div class="pn-main hidden" id="main">
    <nav class="pn-menu" id="menu" aria-label="Разделы"></nav>
    <main class="pn-frames" id="frames"></main>
  </div>

  <footer class="pn-foot hidden" id="foot">
    <p class="pn-status" id="status" role="status"></p>
    <select id="format" aria-label="Формат"></select>
    <button type="button" id="download" disabled>Скачать</button>
  </footer>
  <div id="toast-container"></div>

  <script src="../core/theme.js"></script>
  <script src="../utils/toast.js"></script>
  <script src="../utils/update-check.js"></script>
  <script src="../utils/header.js"></script>
  <script src="../core/page-calls.js"></script>
  <script src="../utils/page-call.js"></script>
  <script src="../core/api.js"></script>
  <script src="../core/chapter-range.js"></script>
  <script src="../utils/formats.js"></script>
  <script src="../core/title-loader.js"></script>
  <script src="../core/snapshot.js"></script>
  <script src="../utils/engine-client.js"></script>
  <script src="../core/site-download.js"></script>
  <script src="../core/panel.js"></script>
</body>
</html>
