<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../assets/icons/icon32.png">
  <title>LibSaver - Подготовка</title>
  <style>body { opacity: 0; }</style>
  <script src="../core/theme-init.js"></script>
  <script src="../utils/title-store.js"></script>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/loading.css">
  <script src="../utils/window-loader.js"></script>
  <script src="../core/theme.js"></script>
  <link rel="stylesheet" href="../libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../css/prepare.css">
  <link rel="stylesheet" href="../css/scale-subtle.css">
  <script src="../libs/popper.min.js"></script>
  <script src="../libs/tippy-bundle.umd.min.js"></script>
  <script src="../utils/page-call.js"></script>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <!-- Кнопка Скачать: ставит тайтл в очередь движка -->
      <button class="btn-save" id="btn-start-download">
        <i class="fa-solid fa-download"></i>
        Скачать
      </button>
      
      <div class="format-selector">
        <select class="format-select" id="format-select" aria-label="Формат файла" title="Формат файла"></select>
      </div>
      <div class="image-server-selector" id="image-server-selector" style="display: none;">
        <select class="server-select" id="server-select" aria-label="Сервер изображений" title="Картинки манги: оригиналы (часто PNG) или JPEG того же размера — файл легче, сервер надёжнее">
          <option value="normal">Оригиналы</option>
          <option value="compressed" selected>JPEG</option>
        </select>
      </div>
      <div class="text-only-toggle" id="text-only-toggle" style="display: none;">
        <label class="checkbox-group">
          <input type="checkbox" id="text-only-checkbox">
          <span class="control__indicator" data-type="checkbox">
            <svg class="svg-inline--fa fa-square-check fa-fw" aria-hidden="true" focusable="false" data-prefix="fas" data-icon="square-check" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" data-state="checked"><path fill="currentColor" d="M64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32zM337 209L209 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L303 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"></path></svg>
            <svg class="svg-inline--fa fa-square fa-fw" aria-hidden="true" focusable="false" data-prefix="far" data-icon="square" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" data-state="default"><path fill="currentColor" d="M384 80c8.8 0 16 7.2 16 16l0 320c0 8.8-7.2 16-16 16L64 432c-8.8 0-16-7.2-16-16L48 96c0-8.8 7.2-16 16-16l320 0zM64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32z"></path></svg>
          </span>
          <span>Только текст</span>
        </label>
      </div>
      <div class="speed-mode-toggle">
        <label class="checkbox-group">
          <input type="checkbox" id="speed-mode-checkbox">
          <span class="control__indicator" data-type="checkbox">
            <svg class="svg-inline--fa fa-square-check fa-fw" aria-hidden="true" focusable="false" data-prefix="fas" data-icon="square-check" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" data-state="checked"><path fill="currentColor" d="M64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32zM337 209L209 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L303 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"></path></svg>
            <svg class="svg-inline--fa fa-square fa-fw" aria-hidden="true" focusable="false" data-prefix="far" data-icon="square" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" data-state="default"><path fill="currentColor" d="M384 80c8.8 0 16 7.2 16 16l0 320c0 8.8-7.2 16-16 16L64 432c-8.8 0-16-7.2-16-16L48 96c0-8.8 7.2-16 16-16l320 0zM64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32z"></path></svg>
          </span>
          <span>Ускорить</span>
        </label>
      </div>
    </div>
    <div class="toolbar-right">
      <div class="quality-info">
        <span class="counter">Картинки: <span id="image-quality-display">Без сжатия</span></span>
        <span class="counter-separator">|</span>
        <span class="counter">Обложки: <span id="cover-quality-display">Без сжатие</span></span>
      </div>
    </div>
  </div>
  
  <div class="container">
    <!-- Зона Метаданные -->
    <div class="zone zone-metadata collapsed">
      <div class="zone-header">
        <h2><i class="fa-solid fa-info-circle"></i> Метаданные</h2>
        <button class="zone-toggle" data-zone="zone-metadata">
          <i class="fa-solid fa-chevron-down"></i>
        </button>
      </div>
      <div class="zone-content" id="metadata-content">
        <!-- Поля метаданных будут добавлены динамически -->
      </div>
    </div>
    
    <!-- Зона Обложки -->
    <div class="zone zone-covers collapsed">
      <div class="zone-header">
        <h2><i class="fa-solid fa-images"></i> Обложки</h2>
        <button class="zone-toggle" data-zone="zone-covers">
          <i class="fa-solid fa-chevron-down"></i>
        </button>
      </div>
      <div class="zone-content">
        <div class="covers-gallery" id="covers-gallery">
          <!-- Галерея обложек будет здесь -->
        </div>
      </div>
    </div>
    
    <!-- Зона Главы -->
    <div class="zone zone-chapters collapsed">
      <div class="zone-header">
        <h2><i class="fa-solid fa-list"></i> Главы</h2>
        <button class="zone-toggle" data-zone="zone-chapters">
          <i class="fa-solid fa-chevron-down"></i>
        </button>
      </div>
      <div class="zone-content">
        <div class="chapters-list" id="chapters-list">
          <!-- Список глав по томам будет здесь -->
        </div>
      </div>
    </div>
    
    <!-- Зона Загрузки: страница downloads.html показывает очередь движка, iframe создаётся при первом «Скачать» -->
    <div class="zone zone-downloads collapsed" id="zone-downloads" style="display: none;">
      <div class="zone-header">
        <h2><i class="fa-solid fa-download"></i> Загрузки</h2>
        <button class="zone-toggle" data-zone="zone-downloads">
          <i class="fa-solid fa-chevron-down"></i>
        </button>
      </div>
      <div class="zone-content">
        <iframe id="downloads-frame" class="downloads-frame" title="Загрузки"></iframe>
      </div>
    </div>
  </div>

  <div class="scroll-buttons" id="scroll-buttons" style="display: none;">
    <button class="scroll-btn" id="scroll-btn" title="Наверх">
      <i class="fa-solid fa-chevron-up"></i>
    </button>
  </div>

  <script src="../core/snapshot.js"></script>
  <script src="../core/chapter-range.js"></script>
  <script src="../core/prepare.js"></script>
  <script src="../utils/scroll.js"></script>
</body>
</html>
