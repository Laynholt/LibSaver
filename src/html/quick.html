<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>LibSaver - Скачать</title>
  <script src="../core/theme-init.js"></script>
  <script src="../utils/title-store.js"></script>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    /* body - весь фрейм и прокручивается, если окошко урезано по высоте; высоту содержимого меряет #quick-content */
    html, body {
      height: 100%;
      box-sizing: border-box;
    }
    html {
      overflow: hidden;
    }
    body {
      overflow-y: auto;
      font-size: var(--font-size-md);
    }
    #quick-content {
      padding: var(--spacing-md);
    }
    .q-msg {
      margin: 0;
      color: var(--text-secondary);
    }
    .q-error {
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
    }
    .q-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-sm);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      min-width: 0;
      color: var(--text-secondary);
      font-size: var(--font-size-sm);
    }
    select {
      min-width: 0;
      text-overflow: ellipsis;
    }
    #download, #retry {
      width: 100%;
      height: 36px;
      margin-top: var(--spacing-sm);
    }
    .q-status {
      margin: var(--spacing-sm) 0 0;
      color: var(--text-secondary);
    }
    .q-status:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div id="quick-content">
  <p class="q-msg" id="loading">Загружаю главы…</p>

  <div class="hidden" id="error">
    <p class="q-msg q-error" id="error-text" role="alert"></p>
    <button type="button" id="retry">Повторить</button>
  </div>

  <form class="hidden" id="form">
    <div class="q-grid">
      <label>От <select id="from"></select></label>
      <label>До <select id="to"></select></label>
    </div>
    <label>Формат <select id="format"></select></label>
    <button type="submit" id="download"></button>
    <p class="q-status" id="status" role="status"></p>
  </form>
  </div>

  <script src="../core/theme.js"></script>
  <script src="../utils/header.js"></script>
  <script src="../core/page-calls.js"></script>
  <script src="../utils/page-call.js"></script>
  <script src="../core/api.js"></script>
  <script src="../core/chapter-range.js"></script>
  <script src="../utils/formats.js"></script>
  <script src="../core/title-loader.js"></script>
  <script src="../core/snapshot.js"></script>
  <script src="../utils/engine-client.js"></script>
  <script src="../core/site-download.js"></script>
  <script src="../core/quick.js"></script>
</body>
</html>
